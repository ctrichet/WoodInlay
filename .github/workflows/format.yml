name: Format and Update Headers

on:
  pull_request:
  push:
    branches: [ "main" ]   # adapte si ta branche par défaut est master/dev

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install black

      - name: Run Black
        run: |
          black .

      - name: Update headers
        run: |
          python scripts/headers.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto-format and update headers" || echo "No changes to commit"

      - name: Push changes
        if: github.ref == 'refs/heads/main'
        run: |
          git push
