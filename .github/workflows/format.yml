name: Format and Update Headers

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install black

      - name: Run Black
        run: |
          black .

      - name: Update headers
        run: |
          python scripts/headers.py

      - name: Verify changes
        id: verify
        run: |
          git diff --exit-code || echo "Code or headers need update"

      # Only push commits automatically on direct push to develop, not on PR
      - name: Commit changes if direct push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto-format and update headers" || echo "No changes to commit"
          git push