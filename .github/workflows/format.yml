name: Format and Update Headers

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      # Checkout complet avec branche suivie
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installer Black
      - name: Install dependencies
        run: pip install black

      # Formattage du code
      - name: Run Black
        run: black .

      # Mise à jour des headers
      - name: Update headers
        run: python scripts/headers.py

      # Vérification si des modifications ont été faites
      - name: Verify changes
        id: verify
        run: git diff --exit-code || echo "Code or headers need update"

      # Commit et push uniquement si push direct (pas PR)
      - name: Commit and push changes if direct push
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "chore: auto-format and update headers" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }}
