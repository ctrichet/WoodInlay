name: Format and Update Headers

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      # Checkout complet avec token persistant pour push
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.ref }}

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installer Black
      - name: Install dependencies
        run: pip install black

      # Mise à jour des headers
      - name: Update headers
        run: python scripts/headers.py

      # Mettre en forme avec black
      - name: Run Black with header protection
        run: |
          for file in $(find . -name "*.py" ! -name "headers.py"); do
            head -n 10 "$file" > "$file.tmp_header"
            tail -n +11 "$file" | black -q - > "$file.tmp_code"
            cat "$file.tmp_header" "$file.tmp_code" > "$file.tmp_full"
            mv "$file.tmp_full" "$file"
            rm "$file.tmp_header" "$file.tmp_code"
          done

      # Vérification si des modifications ont été faites
      - name: Verify changes
        run: git diff --exit-code || echo "Code or headers need update"

      # Commit et push uniquement si push direct (pas PR)
      - name: Commit and push changes if direct push
        if: github.event_name == 'push'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "chore: auto-format and update headers" || echo "No changes to commit"
          git push
