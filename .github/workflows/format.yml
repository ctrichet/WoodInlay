name: Format and Update Headers

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      # Checkout complet avec token persistant pour push
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.ref }}

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installer Black
      - name: Install dependencies
        run: pip install black

      - name: Update headers on changed files
        run: |
          # Récupérer les fichiers modifiés
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            files=$(git diff --name-only origin/develop...HEAD | grep '\.py$' || true)
          else
            files=$(git diff --name-only HEAD~1 HEAD | grep '\.py$' || true)
          fi

          # Exclure headers.py
          files=$(echo "$files" | grep -v 'headers.py' || true)

          if [ -z "$files" ]; then
            echo "No Python files changed, skipping header update."
            exit 0
          fi

          # Passer les fichiers modifiés en paramètre à headers.py
          python scripts/headers.py $files

      - name: Run Black on changed files with header protection
        run: |
          # Récupérer les fichiers modifiés dans le commit ou la PR
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            files=$(git diff --name-only origin/develop...HEAD | grep '\.py$' || true)
          else
            files=$(git diff --name-only HEAD~1 HEAD | grep '\.py$' || true)
          fi

          # Exclure headers.py
          files=$(echo "$files" | grep -v 'headers.py' || true)

          if [ -z "$files" ]; then
            echo "No Python files changed, skipping Black."
            exit 0
          fi

          # Formater chaque fichier en protégeant le header
          for file in $files; do
            echo "Formatting $file"
            head -n 10 "$file" > "$file.tmp_header"
            tail -n +11 "$file" | black -q - > "$file.tmp_code"
            cat "$file.tmp_header" "$file.tmp_code" > "$file.tmp_full"
            mv "$file.tmp_full" "$file"
            rm "$file.tmp_header" "$file.tmp_code"
          done

      # Vérification si des modifications ont été faites
      - name: Verify changes
        run: git diff --exit-code || echo "Code or headers need update"

      # Commit et push uniquement si push direct (pas PR)
      - name: Commit and push changes if direct push
        if: github.event_name == 'push'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "chore: auto-format and update headers" || echo "No changes to commit"
          git push
